<td class="cell group/cell" data-pid data-kind="empty">
  <span class="hidden group-data-[kind=empty]/cell:inline">+</span>
  <span class="hidden group-data-[kind=missed]/cell:inline text-xs italic">Missed</span>
  <img class="sprite hidden group-data-[kind=pokemon]/cell:inline-block" alt="" loading="lazy" data-slot="sprite" />
  <span class="species hidden group-data-[kind=pokemon]/cell:inline font-semibold text-[13px] align-middle" data-slot="name"></span>
  <button type="button" class="favorite-button hidden group-data-[kind=pokemon]/cell:inline-flex" title="Favorite">
    <img src="/star.png" alt="" />
  </button>
</td>
