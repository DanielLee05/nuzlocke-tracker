<!-- Type lookup (controllers/lookup.js): pick one or two types. Colours come from [data-type] rules in app.css. -->
<div class="max-w-[760px] flex flex-col gap-4">
  <div id="type-picker" class="flex flex-wrap gap-2">
    <button type="button" class="type-tag type-pick" data-type="Normal">Normal</button>
    <button type="button" class="type-tag type-pick" data-type="Fire">Fire</button>
    <button type="button" class="type-tag type-pick" data-type="Water">Water</button>
    <button type="button" class="type-tag type-pick" data-type="Electric">Electric</button>
    <button type="button" class="type-tag type-pick" data-type="Grass">Grass</button>
    <button type="button" class="type-tag type-pick" data-type="Ice">Ice</button>
    <button type="button" class="type-tag type-pick" data-type="Fighting">Fighting</button>
    <button type="button" class="type-tag type-pick" data-type="Poison">Poison</button>
    <button type="button" class="type-tag type-pick" data-type="Ground">Ground</button>
    <button type="button" class="type-tag type-pick" data-type="Flying">Flying</button>
    <button type="button" class="type-tag type-pick" data-type="Psychic">Psychic</button>
    <button type="button" class="type-tag type-pick" data-type="Bug">Bug</button>
    <button type="button" class="type-tag type-pick" data-type="Rock">Rock</button>
    <button type="button" class="type-tag type-pick" data-type="Ghost">Ghost</button>
    <button type="button" class="type-tag type-pick" data-type="Dragon">Dragon</button>
    <button type="button" class="type-tag type-pick" data-type="Dark">Dark</button>
    <button type="button" class="type-tag type-pick" data-type="Steel">Steel</button>
    <button type="button" class="type-tag type-pick" data-type="Fairy">Fairy</button>
  </div>

  <div id="type-result" class="group card p-[18px]" data-state="empty">
    <p class="hint hidden group-data-[state=empty]:block">Pick one or two types to see their matchups.</p>
    <!-- @include lookup/matchup.html -->
  </div>
</div>

<template id="tpl-type-tag">
  <span class="type-tag"></span>
</template>
